name: XR Test
on:
  # The browser version's checks; the native Quest branch has its own workflow.
  push:
    branches-ignore: [quest-native]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: xr-${{ github.ref }}
  cancel-in-progress: true
jobs:
  iwer:
    strategy:
      fail-fast: false
      matrix: {shard: [1, 2, 3, 4]}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '24', cache: npm}
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:xr -- --shard=${{ matrix.shard }}/4
      - if: matrix.shard == 1
        run: npm run build
      - if: matrix.shard == 1
        run: npm run test:production
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: iwer-reports-shard-${{ matrix.shard }}-not-hardware-evidence
          path: |
            reports/
            test-results/
          retention-days: 30
