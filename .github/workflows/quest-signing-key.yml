name: Quest permanent signing key · مفتاح التوقيع الدائم (مرة وحدة)
# Creates the Meta Quest release keystore on the runner and stores it straight into the
# DAHROOJ_KEYSTORE_B64 secret; the key never appears in logs, chat or the repository.
# An AES-256 encrypted backup is kept as a short-lived artifact for the owner to save.
# Needs these repository secrets first (added by the owner):
#   DAHROOJ_KEYSTORE_PASSWORD  the keystore password (20+ characters)
#   DAHROOJ_KEYSTORE_ALIAS     e.g. dahrooj
#   KEY_BACKUP_PASSWORD        a different password for the backup file (20+ characters)
#   SIGNING_ADMIN_TOKEN        a fine-grained token with "Secrets: Read and write" on this repo
# Refuses to run if DAHROOJ_KEYSTORE_B64 already exists (the store key must never change).
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  create:
    if: github.repository == '3wasfnjd/Dahrooj-Quest'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with: {distribution: temurin, java-version: '17'}
      - name: Create the key and store it as a secret (nothing secret is printed)
        env:
          GH_TOKEN: ${{ secrets.SIGNING_ADMIN_TOKEN }}
          GH_REPO: ${{ github.repository }}
          KS_PASS: ${{ secrets.DAHROOJ_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.DAHROOJ_KEYSTORE_ALIAS }}
          BACKUP_PASS: ${{ secrets.KEY_BACKUP_PASSWORD }}
        run: |
          set -euo pipefail
          for v in GH_TOKEN KS_PASS KS_ALIAS BACKUP_PASS; do
            if [ -z "${!v}" ]; then echo "::error::Missing secret for $v (see the comment at the top of this workflow)."; exit 1; fi
          done
          if [ "${#KS_PASS}" -lt 20 ] || [ "${#BACKUP_PASS}" -lt 20 ]; then
            echo "::error::Use passwords of at least 20 characters."; exit 1
          fi
          if [ "$KS_PASS" = "$BACKUP_PASS" ]; then
            echo "::error::KEY_BACKUP_PASSWORD must differ from DAHROOJ_KEYSTORE_PASSWORD."; exit 1
          fi
          if gh secret list --repo "$GH_REPO" --json name -q '.[].name' | grep -qx DAHROOJ_KEYSTORE_B64; then
            echo "::error::DAHROOJ_KEYSTORE_B64 already exists. Refusing to replace the permanent store key."; exit 1
          fi
          KS="$RUNNER_TEMP/dahrooj-release.keystore"
          ALIAS="$(printf '%s' "$KS_ALIAS" | tr -d '\r\n' | sed 's/^[[:space:]]*//; s/[[:space:]]*$//')"
          keytool -genkeypair -keystore "$KS" -storetype PKCS12 -alias "$ALIAS" -keyalg RSA -keysize 4096 \
            -validity 36500 -dname "CN=Aboden Games, O=Aboden Games, C=SA" \
            -storepass:env KS_PASS -keypass:env KS_PASS >/dev/null 2>&1
          mkdir -p backup
          printf '%s' "$BACKUP_PASS" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 \
            --symmetric --cipher-algo AES256 --output backup/dahrooj-quest-signing-key.gpg "$KS"
          base64 -w0 "$KS" | gh secret set DAHROOJ_KEYSTORE_B64 --repo "$GH_REPO"
          SHA="$(keytool -list -v -keystore "$KS" -alias "$ALIAS" -storepass:env KS_PASS | sed -n 's/^[[:space:]]*SHA256: //p' | head -1)"
          rm -f "$KS"
          {
            echo "### تم إنشاء مفتاح التوقيع الدائم وحفظه في DAHROOJ_KEYSTORE_B64"
            echo ""
            echo "بصمة الشهادة (عامة، مو سر): \`$SHA\`"
            echo ""
            echo "- نزّل الملف المشفر **dahrooj-quest-signing-key** من أسفل الصفحة واحفظه في مكانين (iCloud + مكان ثاني)."
            echo "- احفظ كلمتي المرور (DAHROOJ_KEYSTORE_PASSWORD و KEY_BACKUP_PASSWORD) في مكان آمن منفصل."
            echo "- احذف السر SIGNING_ADMIN_TOKEN والتوكن نفسه من GitHub الحين."
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dahrooj-quest-signing-key
          path: backup/dahrooj-quest-signing-key.gpg
          if-no-files-found: error
          retention-days: 7
